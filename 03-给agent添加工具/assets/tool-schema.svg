<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#425466"/></marker>
    <style>.title{font:700 21px 'Microsoft YaHei',sans-serif;fill:#132238}.label{font:600 16px 'Microsoft YaHei',sans-serif;fill:#132238}.small{font:14px 'Microsoft YaHei',sans-serif;fill:#526274}.code{font:14px Consolas,monospace;fill:#31445b}.box{stroke:#9aaabd;stroke-width:1.5;rx:12}.line{stroke:#425466;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1100" height="410" fill="#f7f9fc"/>
  <text x="40" y="40" class="title">一个工具定义需要同时让模型和程序看得懂</text>
  <rect x="55" y="90" width="285" height="235" class="box" fill="#e9f1ff"/><text x="197" y="125" text-anchor="middle" class="label">自然语言说明</text><text x="80" y="165" class="small">名称：search_files</text><text x="80" y="195" class="small">用途：查找匹配的文件</text><text x="80" y="225" class="small">限制：只读，不修改文件</text><text x="80" y="255" class="small">适用：需要了解项目结构时</text>
  <rect x="405" y="90" width="285" height="235" class="box" fill="#fff4dc"/><text x="547" y="125" text-anchor="middle" class="label">输入 Schema</text><text x="435" y="165" class="code">directory: string</text><text x="435" y="195" class="code">pattern: string</text><text x="435" y="225" class="code">max_results: integer?</text><text x="435" y="270" class="small">必填项、类型、范围</text>
  <rect x="755" y="90" width="290" height="235" class="box" fill="#e8f6ef"/><text x="900" y="125" text-anchor="middle" class="label">执行入口</text><text x="790" y="170" class="small">Harness 收到请求</text><text x="790" y="200" class="small">校验名称和参数</text><text x="790" y="230" class="small">检查权限与路径</text><text x="790" y="260" class="small">调用真实执行逻辑</text>
  <path d="M340 205 H395" class="line"/><path d="M690 205 H745" class="line"/>
  <text x="55" y="365" class="small">工具描述帮助模型选择，Schema 帮助程序校验，执行入口连接真实环境。</text>
</svg>
