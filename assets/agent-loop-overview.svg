<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">最小 Agent Loop 总体流程</title>
  <desc id="desc">接收任务并初始化历史，循环中模型提出猜测，环境检查并返回反馈，Harness 保存反馈并判断成功或达到最大轮数，成功或到达上限则结束，否则继续下一轮。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10Z" fill="#344054"/></marker>
    <style>
      text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#17212f}.process{fill:#fff;stroke:#475467;stroke-width:2}.decision{fill:#fff;stroke:#475467;stroke-width:2}.flow{fill:none;stroke:#344054;stroke-width:2.4;marker-end:url(#arrow)}.label{font-size:17px;font-weight:700}.note{font-size:14px;fill:#475467}
    </style>
  </defs>
  <rect width="1200" height="690" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-size="28" font-weight="700">最小 Agent Loop：猜数字任务</text>
  <text x="600" y="78" text-anchor="middle" class="note">每轮都由程序传递信息、执行行动、记录反馈并检查停止条件</text>

  <rect class="process" x="450" y="105" width="300" height="62" rx="8"/>
  <text class="label" x="600" y="132" text-anchor="middle">接收任务</text><text class="note" x="600" y="153" text-anchor="middle">猜中 1–100 的秘密数字</text>
  <path class="flow" d="M600 167V197"/>
  <rect class="process" x="450" y="200" width="300" height="58" rx="8"/>
  <text class="label" x="600" y="235" text-anchor="middle">初始化历史记录与轮数</text>
  <path class="flow" d="M600 258V291"/>

  <rect x="260" y="285" width="680" height="330" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="285" y="315" font-size="15" font-weight="700" fill="#475467">每一轮（最多 MAX_TURNS 轮）</text>
  <rect class="process" x="450" y="337" width="300" height="58" rx="8"/>
  <text class="label" x="600" y="373" text-anchor="middle">模型根据目标与历史给出猜测</text>
  <path class="flow" d="M600 395V425"/>
  <rect class="process" x="450" y="428" width="300" height="58" rx="8"/>
  <text class="label" x="600" y="464" text-anchor="middle">环境检查猜测并返回结果</text>
  <path class="flow" d="M600 486V513"/>
  <rect class="process" x="450" y="516" width="300" height="58" rx="8"/>
  <text class="label" x="600" y="552" text-anchor="middle">记录反馈，更新轮数</text>
  <path class="flow" d="M450 545H375V366H442"/>
  <text class="note" x="345" y="452" text-anchor="middle" transform="rotate(-90 345 452)">未结束：反馈进入下一轮</text>

  <path class="flow" d="M750 545H825V455H758"/>
  <text class="note" x="842" y="530">检查停止条件</text>
  <polygon class="decision" points="860,380 970,430 860,480 750,430"/>
  <text class="label" x="860" y="426" text-anchor="middle">猜中或达到</text><text class="label" x="860" y="448" text-anchor="middle">最大轮数？</text>
  <path class="flow" d="M860 380V350H760"/>
  <text class="note" x="805" y="342" text-anchor="middle">否：继续循环</text>
  <path class="flow" d="M970 430H1040V265H760"/>
  <text class="note" x="1065" y="410" text-anchor="middle" transform="rotate(-90 1065 410)">是：退出循环</text>
  <rect x="450" y="635" width="300" height="42" rx="7" fill="#ecfdf3" stroke="#16803c" stroke-width="2"/>
  <text x="600" y="662" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">输出完成或停止状态</text>
  <path class="flow" d="M600 615V632"/>
</svg>
